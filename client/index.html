<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tareas Metatron</title>
    <meta name="description" content="Gestor personal de tareas y turnos familiares" />
    <meta name="theme-color" content="#00205B" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Meta tags específicos para iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tareas Metatron" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Fuentes oficiales de status.getram.cl -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Mulish:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F4F6F9] text-[#10203A] antialiased selection:bg-[#00205B] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Deshabilitar gestos de zoom con 2 dedos y doble toque en iOS Safari / PWA
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
